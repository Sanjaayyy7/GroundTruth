[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groundtruth"
version = "0.8.0"
description = "Groundtruth — an AI reliability platform. AgentProbe: offline red-team evaluation for tool-using agents."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sanjay", email = "sanmanivas@ucdavis.edu"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
keywords = ["ai-safety", "evaluation", "llm", "red-team", "agents", "reliability"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "mypy>=1.11",
    "types-PyYAML>=6",
    "pre-commit>=3.7",
]

[project.scripts]
groundtruth = "groundtruth.cli:main"

[tool.setuptools.packages.find]
include = ["groundtruth*"]

# The distribution is typed: py.typed makes the annotations visible to a
# consumer's own type checker (PEP 561), which is the only way a downstream
# evaluation gets any benefit from them.
[tool.setuptools.package-data]
groundtruth = ["py.typed"]

# ---------------------------------------------------------------------------
# Lint (debt #12). The selected set is the correctness half of ruff, not the
# maximal one:
#   E4/E7/E9 + W + F  pycodestyle errors and pyflakes — real defects
#   I                 import order, the one formatting rule with a fixed answer
#   B                 bugbear: mutable defaults, loop-variable capture, bare zip
#   C4, PIE, SIM,     idiom rules whose fixes are provably behaviour-preserving
#   RET, UP, RUF
# Deliberately NOT selected, with reasons:
#   E501  line length is a formatter's job and this repo ships no formatter;
#         `groundtruth/steward/*` additionally lives under a hard line budget
#         (ADR-0008 falsification trigger), where rewrapping would spend a real
#         law on a cosmetic one. `line-length` is still declared so a formatter
#         added later inherits the convention the code already follows.
#   D     docstring presence: this codebase documents modules and non-obvious
#         functions and leaves obvious ones bare; D would add ~300 findings and
#         reward stub docstrings.
#   ANN   annotations are enforced by mypy below, where the diagnosis is real.
#   PERF  rewrites explanatory append-loops into comprehensions; at n<=200
#         items the gain is nil and the comments lose their home.
#   T20   print() is the CLI's human interface, not a debugging leftover.
[tool.ruff]
line-length = 100
target-version = "py311"
# Frozen and historical trees are records (Constitution lifecycle law): linting
# them can only produce findings that must not be fixed.
# `*.ipynb`: the repository tracks no notebooks, and findings in an untracked
# exploratory one have no owner.
exclude = ["build", "examples", "experiments", ".venv", "groundtruth-site", "*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "I", "B", "C4", "PIE", "SIM", "RET", "UP", "RUF"]
# RUF001-003 flag en dashes and the multiplication sign as "ambiguous unicode".
# They are deliberate typography in prose docstrings and in rendered report
# strings ("goal_drift×2"); the rule cannot tell prose from an identifier.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests bind names purely to assert on them.
"tests/*" = ["RUF059"]

# ---------------------------------------------------------------------------
# Types (debt #12). Strictness is "every function is annotated and the bodies
# are checked", i.e. mypy --strict minus `disallow_any_generics` and
# `disallow_untyped_calls`: the codebase passes `dict`/`tuple` payloads that
# are genuinely heterogeneous JSON (scorecards, manifests, declaration blocks),
# and parameterising them as `dict[str, Any]` would be annotation theatre, not
# type safety. Everything else strict implies is on, including
# `warn_unused_ignores`, so a `type: ignore` that stops being needed fails the
# build instead of rotting.
[tool.mypy]
python_version = "3.11"
files = ["groundtruth"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
# tests/ and experiments/ are excluded: fixtures build deliberately malformed
# payloads to prove the loaders reject them, so annotating them to mypy's
# satisfaction would document the wrong contract.
